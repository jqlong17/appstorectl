<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">appstorectl release pipeline</title>
  <desc id="desc">doctor to build to upload to attach to sync to submit</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1c2e"/>
      <stop offset="100%" stop-color="#1a334d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#7eb6d9"/>
    </marker>
  </defs>
  <rect width="960" height="220" rx="12" fill="url(#bg)"/>
  <text x="32" y="42" fill="#e8f1f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">appstorectl · release pipeline</text>
  <text x="32" y="66" fill="#9bb4c9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">local Mac + Xcode + your ASC API key</text>

  <!-- boxes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">
    <rect x="28" y="100" width="120" height="56" rx="8" fill="#243b55" stroke="#7eb6d9" stroke-width="1.5"/>
    <text x="88" y="125" fill="#e8f1f8" font-weight="700">doctor</text>
    <text x="88" y="143" fill="#9bb4c9" font-size="11">env · certs</text>

    <rect x="184" y="100" width="120" height="56" rx="8" fill="#243b55" stroke="#7eb6d9" stroke-width="1.5"/>
    <text x="244" y="125" fill="#e8f1f8" font-weight="700">build</text>
    <text x="244" y="143" fill="#9bb4c9" font-size="11">archive · IPA</text>

    <rect x="340" y="100" width="120" height="56" rx="8" fill="#243b55" stroke="#7eb6d9" stroke-width="1.5"/>
    <text x="400" y="125" fill="#e8f1f8" font-weight="700">upload</text>
    <text x="400" y="143" fill="#9bb4c9" font-size="11">altool</text>

    <rect x="496" y="100" width="120" height="56" rx="8" fill="#243b55" stroke="#7eb6d9" stroke-width="1.5"/>
    <text x="556" y="125" fill="#e8f1f8" font-weight="700">attach</text>
    <text x="556" y="143" fill="#9bb4c9" font-size="11">wait PROCESSING</text>

    <rect x="652" y="100" width="120" height="56" rx="8" fill="#243b55" stroke="#7eb6d9" stroke-width="1.5"/>
    <text x="712" y="125" fill="#e8f1f8" font-weight="700">sync</text>
    <text x="712" y="143" fill="#9bb4c9" font-size="11">meta · price</text>

    <rect x="808" y="100" width="120" height="56" rx="8" fill="#2a4a3a" stroke="#7dcea0" stroke-width="1.5"/>
    <text x="868" y="125" fill="#e8f1f8" font-weight="700">submit</text>
    <text x="868" y="143" fill="#9bb4c9" font-size="11">--yes</text>
  </g>

  <!-- arrows -->
  <g stroke="#7eb6d9" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="148" y1="128" x2="180" y2="128"/>
    <line x1="304" y1="128" x2="336" y2="128"/>
    <line x1="460" y1="128" x2="492" y2="128"/>
    <line x1="616" y1="128" x2="648" y2="128"/>
    <line x1="772" y1="128" x2="804" y2="128"/>
  </g>

  <text x="32" y="198" fill="#7a93a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Upload does not attach. Attach waits for PROCESSING. Privacy labels stay in the web UI.</text>
</svg>
